<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 76" role="img" aria-labelledby="title">
  <title id="title">Folkets Vitensenter portal logo</title>
  <defs>
    <clipPath id="arch-clip">
      <rect x="0" y="0" width="64" height="34"/>
    </clipPath>
  </defs>

  <!-- Portal arch -->
  <circle
    cx="32"
    cy="32"
    r="27"
    fill="none"
    stroke="#1E303A"
    stroke-width="10"
    clip-path="url(#arch-clip)"
  />

  <!-- Portal stems -->
  <rect x="0" y="29" width="10" height="47" rx="5" fill="#1E303A"/>
  <rect x="54" y="29" width="10" height="47" rx="5" fill="#1E303A"/>

  <!-- Open doorway -->
  <path d="M18 34 L38 44 L38 66 L18 76 Z" fill="#3F6877"/>

  <!-- Curiosity dot -->
  <circle cx="32" cy="25" r="5" fill="#3F6877"/>
</svg>
